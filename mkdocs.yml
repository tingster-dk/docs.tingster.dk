site_name: Tingster Docs
site_description: How to embed Tingster widgets in your own site.
site_url: https://docs.tingster.dk/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/demo.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Resolves :material-*: / :fontawesome-*: shortcodes to inline SVG icons.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Widgets:
      - Quick start: widgets/index.md
      - The three widgets: widgets/variants.md
      - Options: widgets/options.md
      - Troubleshooting: widgets/troubleshooting.md

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://tingster.dk
      name: tingster.dk

copyright: © Tingster
